}
fmtbar.addEventListener("mousedown", (e) => e.preventDefault()); // 保持文字框的選取
fmtbar.addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) applyFmt(b.dataset.f); });
document.addEventListener("selectionchange", () => requestAnimationFrame(placeFmtbar));
document.addEventListener("mouseup", () => setTimeout(placeFmtbar, 0));
document.addEventListener("keyup", (e) => { if (e.shiftKey || e.key.startsWith("Arrow")) placeFmtbar(); });
document.addEventListener("focusout", () => setTimeout(placeFmtbar, 0));
window.addEventListener("scroll", () => { if (!fmtbar.hidden) placeFmtbar(); }, true);
window.addEventListener("resize", () => { if (!fmtbar.hidden) placeFmtbar(); });
window.addEventListener("hashchange", () => { fmtbar.hidden = true; });
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || !fmtTarget()) return;
  const k = e.key.toLowerCase();
  if (k === "b" || k === "i") { e.preventDefault(); applyFmt(k); }
});

/* ======================================================================
   房主設定
   ====================================================================== */
function renderSettings() {
  if (!isOwner()) {
    app.innerHTML = `<div class="setup"><h2>只有房主可以進入設定</h2><a class="btn" href="#/">返回</a></div>`;
    return;
  }
  app.innerHTML = `
    <a class="back" href="#/" style="display:block;max-width:720px;margin:0 auto 18px">← 返回</a>
    <section class="panel">
      <h2>編輯權限</h2>
      <p class="note">只有下列 Google 帳號（加上房主本人）可以新增記錄、建立角色和事件。其他人就算登入也只能看。不需要登入就能瀏覽。<br>
        記錄大家都能互相編輯；角色和事件只有建立者本人（以及房主）能修改。</p>
      <ul class="people">
        <li><span>${state.members[OWNER_EMAIL] ? `<b>${esc(state.members[OWNER_EMAIL])}</b>　<span class="muted">${esc(OWNER_EMAIL)}</span>` : esc(OWNER_EMAIL)}</span><span class="role owner">房主</span></li>
      </ul>
      <ul class="people" id="editorList"></ul>
      <form class="inline-form" id="addEditor">
        <input type="email" id="newEditor" placeholder="夥伴的 Gmail，例如 partner@gmail.com" required>
        <button class="btn primary">加入</button>
      </form>
    </section>
    <section class="panel">
      <h2>網站資訊</h2>
      <label>網站名稱<input id="sTitle" maxlength="60"></label>
      <label>副標題<input id="sSub" maxlength="120" placeholder="例如：浮生若夢，為歡幾何"></label>
      <label>記錄的分類（用逗號分隔，順序即顯示順序）<input id="sCats"></label>
      <label>門派（用逗號分隔，建立角色時可以選）<input id="sSects" placeholder="例如：雲涯派, 月靈山"></label>
      <div class="actions" style="margin-top:8px"><button class="btn primary" id="saveSite">儲存</button></div>
    </section>`;
  $("#sTitle").value = state.site.title || "";
  $("#sSub").value = state.site.subtitle || "";
  $("#sCats").value = state.site.categories.join(", ");
  $("#sSects").value = state.site.sects.join(", ");
  renderEditorList();

  $("#addEditor").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("#newEditor").value.trim().toLowerCase();
    if (!email) return;
    if (email === OWNER_EMAIL.toLowerCase()) { toast("房主本來就有權限"); return; }
    try { await setDoc(doc(db, "settings", "access"), { editors: arrayUnion(email) }, { merge: true }); $("#newEditor").value = ""; toast("已加入 " + email); }
    catch (err) { toast(errMsg(err)); }
  };
  $("#saveSite").onclick = async () => {
    const split = (v) => [...new Set(v.split(/[,，、]/).map((s) => s.trim()).filter(Boolean))];
    const categories = split($("#sCats").value), sects = split($("#sSects").value);
    try {
      await setDoc(doc(db, "settings", "site"), { title: $("#sTitle").value.trim() || "浮生閣", subtitle: $("#sSub").value.trim(),
        categories: categories.length ? categories : DEFAULT_CATEGORIES, sects }, { merge: true });
      toast("網站資訊已更新");
    } catch (err) { toast(errMsg(err)); }
  };
}
function renderEditorList() {
  const ul = $("#editorList"); if (!ul) return;
  ul.innerHTML = state.access.length
    ? state.access.map((m) => `<li><span>${state.members[m.toLowerCase()] ? `<b>${esc(state.members[m.toLowerCase()])}</b>　<span class="muted">${esc(m)}</span>` : esc(m)}</span><button class="btn danger" data-rm="${esc(m)}">移除</button></li>`).join("")
    : `<li style="color:var(--ink-soft)">目前還沒有其他編輯者</li>`;
  $$("[data-rm]", ul).forEach((b) => b.onclick = async () => {
    if (!confirm(`移除 ${b.dataset.rm} 的編輯權限？（對方寫過的內容和角色都會保留）`)) return;
    try { await updateDoc(doc(db, "settings", "access"), { editors: arrayRemove(b.dataset.rm) }); toast("已移除"); }
    catch (err) { toast(errMsg(err)); }
  });
}
</script>
